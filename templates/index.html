<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karakterestimator</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
            color: #fff;
            font-family: 'Arial', sans-serif;
            font-size: 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
            position: relative;
        }
        input, button {
            font-size: 1.5rem;
            border: none;
            border-radius: 10px;
            padding: 10px 20px;
            margin: 10px;
        }
        input {
            background-color: #333;
            color: #fff;
        }
        button {
            background-color: #444;
            color: #fff;
            cursor: pointer;
        }
        button:hover {
            background-color: #555;
        }

        .supported-subjects {
            position: absolute;
            bottom: 10px;
            left: 10px;
            font-size: 0.8rem;
            color: #ccc;
        }
    </style>
</head>
<body>
    <form method="post">
        <label for="subjectCode" style="font-size:1.5rem;">Skriv inn emnekode:</label><br>
        <input type="text" id="subjectCode" name="subjectCode" placeholder="F.eks. TDT4110" required><br>
        <button type="submit">Fortsett</button>
    </form>

    <div class="supported-subjects">
        Støttede emner:
        {% for subj in supported_subjects %}
            {{ subj }}{% if not loop.last %}, {% endif %}
        {% endfor %}
    </div>
</body>
</html>
